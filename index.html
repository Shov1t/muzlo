```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESAGONKA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(circle at center, #171717 0%, #080808 45%, #000 100%);
            font-family: Arial, Helvetica, sans-serif;

            /* =================================
               КАСТОМНЫЙ КУРСОР
               Замени cursor.png на свою картинку
               ================================= */
            cursor: url("cursor.png") 16 16, auto;
        }

        /* Затемнение/свечение фона */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.04),
                    transparent 45%
                );

            animation: backgroundPulse 5s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% {
                opacity: .5;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================
           ЦЕНТРАЛЬНАЯ ОБЛАСТЬ
           ========================= */

        .container {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* =========================
           КНОПКА
           ========================= */

        .play-button {
            position: relative;

            width: 240px;
            height: 240px;

            border: 1px solid rgba(255,255,255,.18);
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #292929,
                    #111 55%,
                    #050505
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;

            cursor: url("cursor.png") 16 16, pointer;

            transition:
                transform .55s cubic-bezier(.16,1,.3,1),
                box-shadow .55s ease,
                border-color .4s ease;

            box-shadow:
                0 0 0 1px rgba(255,255,255,.02),
                0 20px 80px rgba(0,0,0,.8);

            overflow: visible;
        }

        /* Светящийся круг за кнопкой */

        .play-button::before {
            content: "";

            position: absolute;
            inset: -25px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,.08);

            transform: scale(.8);
            opacity: .4;

            transition:
                transform .7s cubic-bezier(.16,1,.3,1),
                opacity .5s ease;
        }

        /* Внутреннее свечение */

        .play-button::after {
            content: "";

            position: absolute;
            inset: 10px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.07),
                    transparent 65%
                );

            opacity: .5;

            transition:
                transform .6s cubic-bezier(.16,1,.3,1),
                opacity .5s ease;
        }

        /* =========================
           HOVER
           ========================= */

        .play-button:hover {
            transform:
                scale(1.12)
                rotate(-4deg);

            border-color: rgba(255,255,255,.5);

            box-shadow:
                0 0 40px rgba(255,255,255,.08),
                0 30px 100px rgba(0,0,0,.9);
        }

        .play-button:hover::before {
            transform: scale(1.18);
            opacity: .8;
        }

        .play-button:hover::after {
            transform: scale(.85);
            opacity: 1;
        }

        /* Небольшая анимация при нажатии */

        .play-button:active {
            transform: scale(.92);
        }

        /* Текст */

        .button-text {
            position: relative;
            z-index: 3;

            transition:
                transform .5s cubic-bezier(.16,1,.3,1),
                letter-spacing .5s ease;
        }

        .play-button:hover .button-text {
            transform: scale(1.08);
            letter-spacing: 5px;
        }

        /* =========================
           PLAY ICON
           ========================= */

        .play-icon {
            position: absolute;

            width: 0;
            height: 0;

            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid white;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                translateY(42px);

            opacity: .8;

            transition:
                transform .5s cubic-bezier(.16,1,.3,1),
                opacity .4s ease;
        }

        .play-button:hover .play-icon {
            transform:
                translate(-50%, -50%)
                translateY(42px)
                translateX(5px)
                scale(1.15);

            opacity: 1;
        }

        /* =========================
           VIDEO OVERLAY
           ========================= */

        .video-overlay {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(0,0,0,.82);

            backdrop-filter: blur(15px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .5s ease,
                visibility .5s ease;

            z-index: 100;
        }

        .video-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
           VIDEO BUBBLE
           ========================= */

        .video-wrapper {
            position: relative;

            width: min(85vw, 1100px);
            height: min(75vh, 700px);

            border-radius: 50%;

            overflow: hidden;

            transform:
                scale(0)
                rotate(-15deg);

            opacity: 0;

            background: #000;

            box-shadow:
                0 0 0 1px rgba(255,255,255,.12),
                0 30px 100px rgba(0,0,0,.9);

            transition:
                transform .85s cubic-bezier(.16,1,.3,1),
                opacity .45s ease,
                border-radius .85s cubic-bezier(.16,1,.3,1);
        }

        /* Появление пузыря */

        .video-overlay.active .video-wrapper {
            transform:
                scale(1)
                rotate(0deg);

            opacity: 1;

            border-radius: 24px;

            transition-delay: .05s;
        }

        /* Само видео */

        video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        /* =========================
           CLOSE BUTTON
           ========================= */

        .close-button {
            position: absolute;

            top: 30px;
            right: 30px;

            width: 50px;
            height: 50px;

            border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%;

            background: rgba(0,0,0,.5);

            color: white;

            font-size: 25px;
            font-weight: 200;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: url("cursor.png") 16 16, pointer;

            transition:
                transform .4s cubic-bezier(.16,1,.3,1),
                background .3s ease,
                border-color .3s ease;

            z-index: 200;
        }

        .close-button:hover {
            transform: rotate(90deg) scale(1.1);

            background: rgba(255,255,255,.12);

            border-color: rgba(255,255,255,.5);
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .play-button {
                width: 190px;
                height: 190px;
                font-size: 15px;
            }

            .video-wrapper {
                width: 92vw;
                height: 60vh;
            }

            .close-button {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <button class="play-button" id="playButton">

            <span class="button-text">
                Watch
            </span>

            <span class="play-icon"></span>

        </button>

    </main>


    <!-- =========================
         VIDEO
         ========================= -->

    <div class="video-overlay" id="videoOverlay">

        <button class="close-button" id="closeButton">
            ×
        </button>

        <div class="video-wrapper">

            <!--
                ЗАМЕНИ video.mp4
                НА СВОЙ ФАЙЛ
            -->

            <video
                id="video"
                src="video.mp4"
                controls
                playsinline
            ></video>

        </div>

    </div>


    <script>

        const playButton = document.getElementById("playButton");
        const videoOverlay = document.getElementById("videoOverlay");
        const closeButton = document.getElementById("closeButton");
        const video = document.getElementById("video");


        /* =========================
           ОТКРЫТЬ ВИДЕО
           ========================= */

        playButton.addEventListener("click", () => {

            videoOverlay.classList.add("active");

            /*
                Небольшая задержка нужна,
                чтобы CSS-анимация пузыря
                успела начаться.
            */

            setTimeout(() => {

                video.play();

            }, 450);

        });


        /* =========================
           ЗАКРЫТЬ ВИДЕО
           ========================= */

        closeButton.addEventListener("click", closeVideo);


        /* Закрытие по ESC */

        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {
                closeVideo();
            }

        });


        function closeVideo() {

            video.pause();

            videoOverlay.classList.remove("active");

        }


        /* =========================
           КЛИК ПО ФОНУ
           ========================= */

        videoOverlay.addEventListener("click", (event) => {

            if (event.target === videoOverlay) {
                closeVideo();
            }

        });

    </script>

</body>
</html>
